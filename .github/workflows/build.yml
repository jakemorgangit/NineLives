name: Build

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

# A re-push to a PR cancels that PR's superseded in-flight run, and a push to main cancels
# that branch's superseded run — newest SHA wins. Finishing a build of code that is no
# longer the head helps nobody on a shared Windows runner pool. (Pattern borrowed from
# erikdarlingdata/PerformanceMonitor's build.yml.)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('build-pr-{0}', github.event.pull_request.number) || format('build-push-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # A full cold run (restore + build + tests + self-contained publish) fits well inside
    # 10 minutes; past 30 something is hung, and the default 6h would hold a runner hostage.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore NineLives.sln

      # -warnaserror locks in the current zero-warning state: a PR that introduces the
      # first compiler warning fails here instead of starting an accumulation nobody
      # notices until there are dozens.
      - name: Build
        run: dotnet build NineLives.sln -c Release --no-restore -warnaserror

      # SqlExecutionFailureTests pin the "a failed restore must not report success" contract and
      # need a real instance. windows-latest ships SQL Server Express LocalDB; if it starts, point
      # the suite at it. Best effort by design — if LocalDB is ever absent from the image those
      # tests skip and the rest of the suite is unaffected, rather than the build breaking on an
      # environment detail.
      - name: Start SQL Server LocalDB (best effort)
        shell: pwsh
        run: |
          sqllocaldb create MSSQLLocalDB 2>$null
          sqllocaldb start MSSQLLocalDB
          if ($LASTEXITCODE -eq 0) {
            "NINELIVES_TEST_SQL=(localdb)\MSSQLLocalDB" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "::notice title=Live SQL tests enabled::LocalDB started; SqlExecutionFailureTests will run."
          } else {
            Write-Host "::warning title=Live SQL tests skipped::LocalDB unavailable on this runner."
          }
          exit 0

      - name: Run tests
        run: dotnet test src/NineLives.Tests/NineLives.Tests.csproj -c Release --no-build --verbosity normal

      # The shipping shape is a self-contained single-file exe — prove on every PR that it
      # still publishes, not just that the solution compiles. (~2 min, and it is exactly
      # what release.yml will do for real.)
      - name: Publish smoke test (single-file exe)
        run: dotnet publish src/NineLives/NineLives.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = 'publish/NineLives.exe'
          if (-not (Test-Path $exe)) { throw "Publish did not produce $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host ("NineLives.exe published: {0:N1} MB" -f $size)

      # Latest-main build, grabbable from the Actions run page. PR runs skip this: the
      # smoke publish above already proved the shape, and fork PRs shouldn't mint artifacts.
      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        with:
          name: NineLives-main-${{ github.sha }}
          path: publish/NineLives.exe
          retention-days: 14
