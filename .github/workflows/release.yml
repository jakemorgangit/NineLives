name: Release

on:
  release:
    types: [published]

permissions:
  contents: write
  # Build provenance attestation: id-token mints the short-lived Sigstore identity that
  # proves the signature came from this workflow, attestations stores the result.
  id-token: write
  attestations: write

# Release runs are never cancelled and never share a concurrency group — each one must
# finish and attach its assets to the release that triggered it.
concurrency:
  group: release-${{ github.run_id }}

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Locked, same as build.yml — the shipped exe is built from the exact dependency graph
      # that was reviewed and tested, not from whatever was newest on nuget.org that morning.
      - name: Restore dependencies
        run: dotnet restore NineLives.sln --locked-mode

      - name: Build
        run: dotnet build NineLives.sln -c Release --no-restore -warnaserror

      # A release compiles AND tests from a cold tree — the tag is not exempt from the
      # same gate every PR passes.
      - name: Run tests
        run: dotnet test src/NineLives.Tests/NineLives.Tests.csproj -c Release --no-build --verbosity normal

      - name: Get version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/NineLives/NineLives.csproj)).Project.PropertyGroup.Version | Where-Object { $_ }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      # Through the publish PROFILE, not a hand-repeated flag list. The two had drifted - the
      # profile asked for ReadyToRun and this line did not - and nothing compares them, so the
      # difference went unnoticed through three releases (#39).
      - name: Publish single-file exe (x64)
        run: dotnet publish src/NineLives/NineLives.csproj -p:PublishProfile=SingleFileExe -o publish

      # Windows on ARM is ordinary on new laptops now, and an x64 build runs there only through
      # emulation - slower, and with its own class of oddity. The profile was written with its
      # RuntimeIdentifier overridable from the command line precisely so a second architecture is
      # one more line rather than a second copy of every flag (#39).
      - name: Publish single-file exe (arm64)
        run: dotnet publish src/NineLives/NineLives.csproj -p:PublishProfile=SingleFileExe -p:RuntimeIdentifier=win-arm64 -o publish-arm64

      # The CLI ships beside the app (#63): same profile arrangement, same two architectures,
      # into the same folders so the zips below carry both front ends of the one engine.
      - name: Publish CLI (x64)
        run: dotnet publish src/NineLives.Cli/NineLives.Cli.csproj -p:PublishProfile=SingleFileExe -o publish

      - name: Publish CLI (arm64)
        run: dotnet publish src/NineLives.Cli/NineLives.Cli.csproj -p:PublishProfile=SingleFileExe -p:RuntimeIdentifier=win-arm64 -o publish-arm64

      - name: Package release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          New-Item -ItemType Directory -Force -Path releases | Out-Null

          # The exe IS the product (portable, no installer) - ship it directly, plus a
          # versioned zip for anyone whose tooling wants an archive.
          #
          # The bare NineLives.exe stays x64 and unsuffixed. It is what every existing link, the
          # README and the update check all point at, and what somebody who just wants the app
          # clicks - so the architecture that runs everywhere keeps the plain name, and arm64 is
          # named for what it is rather than quietly becoming the default for people on x64.
          Copy-Item publish/NineLives.exe releases/NineLives.exe
          Copy-Item publish/9lives.exe releases/9lives.exe
          Compress-Archive -Path publish/NineLives.exe, publish/9lives.exe -DestinationPath "releases/NineLives-$version-win-x64.zip" -Force

          Copy-Item publish-arm64/NineLives.exe releases/NineLives-arm64.exe
          Copy-Item publish-arm64/9lives.exe releases/9lives-arm64.exe
          Compress-Archive -Path publish-arm64/NineLives.exe, publish-arm64/9lives.exe -DestinationPath "releases/NineLives-$version-win-arm64.zip" -Force

          $checksums = Get-ChildItem releases/NineLives*, releases/9lives* | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          }
          $checksums | Out-File -FilePath releases/SHA256SUMS.txt -Encoding utf8
          Write-Host "Checksums:"
          $checksums | ForEach-Object { Write-Host $_ }

      # Signed, tamper-evident proof of where this exe came from: which repo, which commit,
      # which workflow run. Anyone can check it with
      #     gh attestation verify NineLives.exe --repo jakemorgangit/NineLives
      # and get a hard answer, rather than trusting that the file on the Releases page is
      # the one this workflow built. A checksum only proves the file matches a number
      # published next to it; provenance ties it back to source.
      #
      # This is NOT code signing and does nothing for SmartScreen - see #33 and
      # docs/code-signing.md. It is the part that can be done without a certificate.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            releases/NineLives.exe
            releases/NineLives-arm64.exe
            releases/9lives.exe
            releases/9lives-arm64.exe
            releases/NineLives-${{ steps.version.outputs.VERSION }}-win-x64.zip
            releases/NineLives-${{ steps.version.outputs.VERSION }}-win-arm64.zip

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.event.release.tag_name }} releases/NineLives.exe releases/NineLives-arm64.exe releases/9lives.exe releases/9lives-arm64.exe "releases/NineLives-${{ steps.version.outputs.VERSION }}-win-x64.zip" "releases/NineLives-${{ steps.version.outputs.VERSION }}-win-arm64.zip" releases/SHA256SUMS.txt --clobber
